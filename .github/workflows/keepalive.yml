name: Supabase keep alive

# The free tier pauses a project after a week without API activity. Cron activity inside the
# database does not count, so this calls the public health RPC through PostgREST every 3 days.
# Secrets: SUPABASE_URL (https://<ref>.supabase.co) and SUPABASE_ANON_KEY (public anon key).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call rpc/health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets are required" >&2
            exit 1
          fi
          body=$(curl --silent --show-error --fail --max-time 30 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "health: ${body}"
          [ "${body}" = '"ok"' ] || { echo "unexpected health response" >&2; exit 1; }
